<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>stagewash — stage lighting coverage calculator</title>
    <meta
      name="description"
      content="Model a stage and lighting rig, focus the fixtures, and see the light levels and coverage on the deck before you get to the venue."
    />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      About dialog. Both files are vendored from stoatworks-backend/about and
      generated by its sync-about.py — edit them there, never here. Classic +
      defer like the support footer: about-data.js only sets defaults, so it and
      the app's own startup can load in either order.
    -->
    <script src="/about-data.js" defer></script>
    <script src="/about.js" defer></script>
    <!--
      Support footer. Vendored from stoatworks-backend/support-footer — edit it
      there and re-run that repo's scripts/sync-support-footer.sh, never here.
      Classic + defer on purpose: it reads its config off this tag, and
      document.currentScript is null inside a module.

      No data-repo: this repo is private, and the footer leaves the "source is
      on GitHub" link out entirely rather than rendering one that 404s.
    -->
    <script
      src="/support-footer.js"
      defer
      data-app="stagewash"
      data-note="It runs entirely in your browser — no account, and no rig you build is uploaded."
    ></script>
  </body>
</html>
